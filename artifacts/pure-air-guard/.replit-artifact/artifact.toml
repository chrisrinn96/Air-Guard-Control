kind = "web"
previewPath = "/"
title = "Pure Air Guard"
version = "1.0.0"
id = "artifacts/pure-air-guard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26179

[services.development]
run = "pnpm --filter @workspace/pure-air-guard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pure-air-guard", "run", "build" ]
publicDir = "artifacts/pure-air-guard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26179"
BASE_PATH = "/"
